name: cup_bot (cờ úp - mystery_xiangqi via wine)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  run-cup-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cài deps
        run: |
          pip install --break-system-packages websocket-client py7zr
          sudo apt-get update -y && sudo apt-get install -y wine64 unrar-free

      - name: Tải Jieqibox engines (PKJQ.exe cho cờ úp)
        run: |
          mkdir -p jieqibox
          # Jieqibox.rar đã có trong repo (commit cũ)
          if [ -f Jieqibox.rar ]; then
            unrar x -o+ Jieqibox.rar jieqibox/
          else
            curl -sL "https://github.com/nguyen05566/vht/raw/main/Jieqibox.rar" -o Jieqibox.rar
            unrar x -o+ Jieqibox.rar jieqibox/
          fi
          ls -la jieqibox/Jieqibox/Engines/PikaJieQi0111/

      - name: Tải pikafish.nnue (NNUE cho PKJQ)
        run: |
          # PKJQ.exe cần pikafish.nnue cùng thư mục — tải từ networks repo
          curl -sL "https://github.com/official-pikafish/Networks/releases/download/master-net/pikafish.nnue" \
            -o jieqibox/Jieqibox/Engines/PikaJieQi0111/pikafish.nnue
          ls -la jieqibox/Jieqibox/Engines/PikaJieQi0111/pikafish.nnue

      - name: Cài wine portable (Kron4ek 9.0)
        run: |
          mkdir -p wine-portable
          curl -sL "https://github.com/Kron4ek/Wine-Builds/releases/download/9.0/wine-9.0-staging-amd64.tar.xz" \
            -o /tmp/wine.tar.xz
          tar -xf /tmp/wine.tar.xz -C wine-portable
          ls wine-portable/wine-9.0-staging-amd64/bin/wine64

      - name: Chạy cup_bot
        env:
          CARO_USER19: nguyen15
          CARO_PASSWD19: nhat123456
          WINEPREFIX: /home/runner/wine-prefix
        run: |
          mkdir -p $WINEPREFIX
          timeout 45m python3 cup_bot.py 2>&1 | tee cup_run.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cup_run_log
          path: cup_run.log
          retention-days: 3
