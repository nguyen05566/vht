name: Chuyển Xu Đơn Lẻ (Tùy Chọn ID & Số Xu)

on:
  workflow_dispatch:
    inputs:
      user:
        description: 'Tên đăng nhập tài khoản gửi'
        required: true
        type: string
      password:
        description: 'Mật khẩu tài khoản gửi'
        required: true
        type: string
      dest_id:
        description: 'Player ID bất kỳ của người nhận (ví dụ: 69284651, 65692738...)'
        required: true
        type: string
      amount:
        description: 'Số xu tùy ý muốn chuyển (vd: 50000, 1000000, 1m, 50m, 500k... Để trống hoặc 0 = chuyển tất cả)'
        required: false
        default: '0'
        type: string
      percent:
        description: 'Phần trăm xu chuyển nếu không nhập số xu cụ thể (1-100)'
        required: false
        default: '100'
        type: string
      spin:
        description: 'Quay vòng quay may mắn gom xu trước khi chuyển?'
        required: false
        default: false
        type: boolean

jobs:
  transfer:
    name: Chuyển Xu WebSocket
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài đặt thư viện phụ thuộc
        run: |
          pip install --upgrade pip
          pip install requests websocket-client

      - name: Thực hiện chuyển xu qua WebSocket
        env:
          USER_NAME: ${{ inputs.user }}
          USER_PASS: ${{ inputs.password }}
          DEST_ID: ${{ inputs.dest_id }}
          AMOUNT: ${{ inputs.amount }}
          PERCENT: ${{ inputs.percent }}
          DO_SPIN: ${{ inputs.spin }}
        run: |
          SPIN_FLAG=""
          if [ "$DO_SPIN" = "true" ]; then
            SPIN_FLAG="--spin"
          fi

          python transfer_one.py \
            --user "$USER_NAME" \
            --password "$USER_PASS" \
            --dest "$DEST_ID" \
            --amount "${AMOUNT:-0}" \
            --percent "${PERCENT:-100}" \
            $SPIN_FLAG
