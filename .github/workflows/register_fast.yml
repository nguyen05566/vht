name: Tạo TK Nhanh (Fast)

on:
  workflow_dispatch:
    inputs:
      base_name:
        description: 'Tên cơ sở (vd: test / nguyen / vip...)'
        required: true
        default: 'test'
      count:
        description: 'Số lượng tk (max 50000)'
        required: true
        default: '50000'
      pwd:
        description: 'MK chung cho mọi tk mới'
        required: true
      concurrency:
        description: 'Số luồng song song (5-80, default 40)'
        required: false
        default: '40'
      chunk_size:
        description: 'Tk mỗi file (default 5000)'
        required: false
        default: '5000'
      skip_spin:
        description: 'Bỏ qua quay số?'
        required: false
        type: boolean
        default: true
      skip_transfer:
        description: 'Bỏ qua chuyển x?'
        required: false
        type: boolean
        default: true
      pm_user:
        description: 'TK cần xóa tin (để trống = bỏ qua)'
        required: false
        default: ''
      pm_pass:
        description: 'MK TK xóa tin'
        required: false
        default: ''

env:
  REGISTER_USER: ${{ github.event.inputs.base_name || 'test' }}
  REGISTER_COUNT: ${{ github.event.inputs.count || '50000' }}
  REGISTER_PW: ${{ github.event.inputs.pwd }}
  REGISTER_CONCURRENCY: ${{ github.event.inputs.concurrency || '40' }}
  CHUNK_SIZE: ${{ github.event.inputs.chunk_size || '5000' }}
  PM_USER: ${{ github.event.inputs.pm_user || '' }}
  PM_PW: ${{ github.event.inputs.pm_pass || '' }}

permissions:
  contents: write

jobs:
  fast_register:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install websockets ddddocr websocket-client requests

      # ==================== ĐĂNG KÝ + COMMIT SONG SONG ====================
      - name: Đăng ký nhanh + tự commit
        env:
          GIT_AUTHOR_NAME: bot
          GIT_AUTHOR_EMAIL: bot@users.noreply.github.com
          GIT_COMMITTER_NAME: bot
          GIT_COMMITTER_EMAIL: bot@users.noreply.github.com
        run: |
          # Cài git config
          git config user.email "bot@users.noreply.github.com"
          git config user.name "bot"

          # Chạy register_fast.py ở background
          python register_fast.py &
          PID=$!
          echo "Register PID: $PID"

          # Background committer: mỗi 30s kiểm tra file mới -> commit + push
          while kill -0 $PID 2>/dev/null; do
            sleep 30
            if [ -f .commit_ready ]; then
              rm -f .commit_ready
              echo "--- Commit checkpoint ---"
              git add accfast*.txt
              if ! git diff --cached --quiet; then
                files=$(git diff --cached --name-only | tr '\n' ' ')
                git commit -m "register_fast: $files"
                git push 2>/dev/null || {
                  echo "push bị chặn, rebase..."
                  git pull --rebase --autostash 2>/dev/null || true
                  sleep 10
                  git push 2>/dev/null || true
                }
              fi
            fi
          done

          # Chờ Python xong
          wait $PID
          EXIT_CODE=$?
          echo "Register exit code: $EXIT_CODE"

          # Commit cuối cùng
          echo "--- Final commit ---"
          rm -f .commit_ready .register_done
          git add accfast*.txt
          if ! git diff --cached --quiet; then
            files=$(git diff --cached --name-only | tr '\n' ' ')
            git commit -m "register_fast DONE: $files"
            ok=0
            for i in 1 2 3 4 5; do
              if git push; then ok=1; break; fi
              git pull --rebase --autostash 2>/dev/null || true
              sleep 15
            done
            [ "$ok" = "1" ] || echo "CẢNH BÁO: push cuối thất bại"
          else
            echo "Không có file mới để commit"
          fi

          exit $EXIT_CODE

      # ==================== XÓA TIN NHẮN (nếu có) ====================
      - name: Xóa tin nhắn
        if: >-
          !cancelled() &&
          env.PM_USER != '' &&
          env.PM_USER != 'n/a'
        run: |
          python pm_clean_all.py --user "$PM_USER" --password "$PM_PW" || echo "Xóa tin thất bại"

      # ==================== UPLOAD KẾT QUẢ ====================
      - name: Upload kết quả
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accfast-${{ github.run_id }}
          path: accfast*.txt
          if-no-files-found: warn
