name: d

on:
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: 'Runtime (hours)'
        required: false
        default: '5'
        type: string
  schedule:  # Watchdog: tu phuc hoi neu chuoi ban giao bi dut
    - cron: '45 */6 * * *'

permissions:
  contents: read
  actions: write  # can de tu kich phien ke tiep qua API

concurrency:
  group: ${{ github.workflow }}-gamevh-account
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install websockets requests --break-system-packages

      - name: Run Chan Bot d.py (tu ban giao tru khi het gio)
        env:
          CHAN_RUNTIME_HOURS: ${{ inputs.runtime_hours || '5' }}
          # Uu tien Secrets neu co, khong co thi d.py fallback ve hardcode ngan100
          CHAN_USER: ${{ secrets.CHAN_USER }}
          CHAN_PWWD: ${{ secrets.CHAN_PWWD }}
          HANDOFF_MINUTES: '348'
        run: |
          START=$(date +%s)
          LIMIT=$((HANDOFF_MINUTES * 60))
          echo "Bot chay toi da ${HANDOFF_MINUTES} phut roi tu ban giao sang phien moi (job timeout 355p)"
          while true; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - START))
            REMAINING=$((LIMIT - ELAPSED))
            if [ "$REMAINING" -le 60 ]; then
              echo "Con ${REMAINING}s < 60s: den gio ban giao, dung bot de kich phien moi"
              break
            fi
            echo "=== $(date -u +'%Y-%m-%dT%H:%M:%SZ') Starting d.py (phut $((ELAPSED / 60))/${HANDOFF_MINUTES}) ==="
            # Gioi han moi luot bot khong vuot qua gio ban giao (bot tu thoat sau RUNTIME neu crash/het gio)
            timeout "${REMAINING}s" python3 -u d.py || echo "d.py exited with code $?"
            echo "Restarting d.py in 10 seconds"
            sleep 10
          done

      - name: Kich phien ke tiep (ban giao lien tuc)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/d.yml/dispatches \
              -d '{"ref":"main"}')
            echo "Lan $i: dispatch HTTP $CODE"
            if [ "$CODE" = "204" ]; then
              echo "Da kich phien moi thanh cong"
              exit 0
            fi
            sleep 15
          done
          echo "Khong kich duoc phien moi sau 3 lan thu (cron 6h se tu phuc hoi)"
          exit 1
