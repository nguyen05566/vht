name: nguyen13

on:
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: 'Runtime (hours)'
        required: false
        default: '5.7'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-gamevh-account
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install websockets websocket-client requests --break-system-packages

      - name: Run Caro Bot nguyen13 (400 xu, no avatar, acc from acc_valid_2.txt[5])
        env:
          CARO_RUNTIME_HOURS: ${{ inputs.runtime_hours || '5.7' }}
          CARO_ACC_FILE: "acc_valid_2.txt"
          CARO_ACC_INDEX: "5"
        run: |
          echo "Starting nguyen13.py (Caro, 400 xu, acc=acc_valid_2.txt[5])"
          while true; do
            echo "=== $(date -u +'%Y-%m-%dT%H:%M:%SZ') Starting nguyen13.py ==="
            python3 -u nguyen13.py || echo "nguyen13.py exited with code $?"
            echo "Restarting nguyen13.py in 10 seconds"
            sleep 10
          done
