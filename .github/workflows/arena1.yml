name: arena1

on:
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: 'Runtime (hours)'
        required: false
        default: '5.7'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-gamevh-account
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install websockets websocket-client requests --break-system-packages

      - name: Run Caro Bot arena1 (400 xu, no avatar, acc from acc_valid_1.txt[0])
        env:
          CARO_RUNTIME_HOURS: ${{ inputs.runtime_hours || '5.7' }}
          CARO_ACC_FILE: "acc_valid_1.txt"
          CARO_ACC_INDEX: "0"
        run: |
          echo "Starting arena1.py (Caro, 400 xu, acc=acc_valid_1.txt[0])"
          while true; do
            echo "=== $(date -u +'%Y-%m-%dT%H:%M:%SZ') Starting arena1.py ==="
            python3 -u arena1.py || echo "arena1.py exited with code $?"
            echo "Restarting arena1.py in 10 seconds"
            sleep 10
          done
