name: Quay & Chuyển x & Xóa tin nhắn

on:
  workflow_dispatch:
    inputs:
      list_file:
        description: 'File danh sách, nhiều file cách nhau dấu phẩy (vd accfast1.txt,accfast2.txt). Để trống = tự tìm acc*.txt'
        required: false
        default: ''
      prefix:
        description: 'Tên đầu nếu KHÔNG dùng file (vd test). Kết hợp với start/end'
        required: false
        default: ''
      start:
        description: 'Số bắt đầu (vd 1)'
        required: false
        default: '1'
      end:
        description: 'Số kết thúc'
        required: false
        default: ''
      pwd:
        description: 'Mk chung các tk'
        required: true
        default: ''
      dest_id:
        description: 'PlayerId nhận x (cấp 1)'
        required: true
        default: '69282667'
      dest_user:
        description: 'Username tk nhận cấp 1 (để chuyển tiếp cấp 2). Rỗng = dùng default trong code (nguyenpy1)'
        required: false
        default: 'nguyenpy1'
      dest_pass:
        description: 'Mật khẩu tk nhận cấp 1. RỖNG = dùng cùng pwd (MK chung). Gán nếu nguyenpy1 có MK khác'
        required: false
        default: ''
      dest2_id:
        description: 'PlayerId nhận x cấp 2 (chuyển tiếp từ cấp 1). Rỗng hoặc 0 = TẮT chuyển tiếp'
        required: false
        default: '69284649'
      pm_user:
        description: 'Tk cần xóa tin nhắn. Mặc định = dest_user (nguyenpy1). Gõ n/a để BỎ QUA'
        required: false
        default: 'nguyenpy1'
      pm_pass:
        description: 'Mk tk xóa tin. RỖNG = dùng DEST_PASS (nhat434241)'
        required: false
        default: ''
      workers:
        description: 'Số luồng (5-50, default 30)'
        required: false
        default: '30'
      batch_size:
        description: 'Account mỗi lô (default 500)'
        required: false
        default: '500'
      pipeline:
        description: 'Pipeline: quay lô sau song song chuyển lô trước (gấp 2x)'
        required: false
        type: boolean
        default: true
      per_batch_forward:
        description: 'Forward sang cấp 2 sau MỖI lô (mặc định false -> chỉ forward 1 lần cuối, tránh server block)'
        required: false
        type: boolean
        default: false
      forward_retry:
        description: 'Số lần retry forward (login/transfer fail) — default 3'
        required: false
        default: '3'
      forward_retry_delay:
        description: 'Giây chờ giữa các retry forward — default 30'
        required: false
        default: '30'

env:
  LIST_FILE: ${{ github.event.inputs.list_file || '' }}
  PREFIX: ${{ github.event.inputs.prefix || '' }}
  START: ${{ github.event.inputs.start || '1' }}
  END: ${{ github.event.inputs.end || '' }}
  PW: ${{ github.event.inputs.pwd }}
  DEST_ID: ${{ github.event.inputs.dest_id || '69282667' }}
  DEST_USER: ${{ github.event.inputs.dest_user || '' }}
  DEST_PW: ${{ github.event.inputs.dest_pass || '' }}
  DEST2_ID: ${{ github.event.inputs.dest2_id || '' }}
  PM_USER: ${{ github.event.inputs.pm_user || '' }}
  PM_PW: ${{ github.event.inputs.pm_pass || '' }}
  WORKERS: ${{ github.event.inputs.workers || '30' }}
  BATCH: ${{ github.event.inputs.batch_size || '500' }}
  PIPELINE: ${{ github.event.inputs.pipeline || 'true' }}
  PER_BATCH_FORWARD: ${{ github.event.inputs.per_batch_forward || 'false' }}
  FORWARD_RETRY: ${{ github.event.inputs.forward_retry || '3' }}
  FORWARD_RETRY_DELAY: ${{ github.event.inputs.forward_retry_delay || '30' }}

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Quay vòng quay + Chuyển toàn bộ x
        run: |
          # Xây dựng cờ chuyển tiếp cấp 2 (luôn bật nếu DEST2_ID != empty và != 0)
          # Nếu DEST_USER rỗng -> script dùng DEST_NAME mặc định (nguyenpy1).
          # Nếu DEST_PASS rỗng -> script dùng --password (MK chung).
          DEST_FLAGS=""
          if [ -n "$DEST2_ID" ] && [ "$DEST2_ID" != "0" ]; then
            DEST_FLAGS="--dest2 $DEST2_ID"
            if [ -n "$DEST_USER" ]; then
              DEST_FLAGS="$DEST_FLAGS --dest-user \"$DEST_USER\""
            fi
            if [ -n "$DEST_PW" ]; then
              DEST_FLAGS="$DEST_FLAGS --dest-pass \"$DEST_PW\""
            fi
            echo "🔄 Bật chuyển tiếp cấp 2: tk=[$DEST_USER hoặc mặc định nguyenpy1] (id=$DEST_ID) -> id=$DEST2_ID"
            if [ -z "$DEST_PW" ]; then
              echo "📌 dest_pass rỗng -> dùng MK chung (--password)"
            fi
          else
            echo "⏭️  DEST2_ID rỗng -> TẮT chuyển tiếp cấp 2"
          fi

          PIPELINE_FLAG=""
          if [ "$PIPELINE" = "true" ]; then
            PIPELINE_FLAG="--pipeline"
          fi

          PER_BATCH_FLAG=""
          if [ "$PER_BATCH_FORWARD" = "true" ]; then
            PER_BATCH_FLAG="--per-batch-forward"
            echo "📌 Bật forward sau mỗi lô"
          else
            echo "📌 Chỉ forward 1 lần cuối (mặc định)"
          fi

          FORWARD_FLAGS="$PER_BATCH_FLAG --forward-retry $FORWARD_RETRY --forward-retry-delay $FORWARD_RETRY_DELAY"

          if [ -n "$PREFIX" ]; then
            echo "▶ Dải tên: $PREFIX $START..$END (pipeline: $PIPELINE)"
            if [ -z "$END" ]; then
              echo "❌ Thiếu số kết thúc (end). Gõ prefix + start + end."
              exit 1
            fi
            python spin_and_transfer.py --range "$PREFIX $START $END" \
              --password "$PW" --dest "$DEST_ID" $DEST_FLAGS $FORWARD_FLAGS \
              --execute --phase all --prune \
              --batch-size "$BATCH" --workers "$WORKERS" $PIPELINE_FLAG \
              --append --skip-done
          elif [ -n "$LIST_FILE" ]; then
            # Chạy TỪNG FILE lần lượt, không gộp
            FILE_IDX=0
            TOTAL=$(echo "$LIST_FILE" | tr ',' '\n' | wc -l)
            echo "$LIST_FILE" | tr ',' '\n' | while read -r ONE_FILE; do
              ONE_FILE=$(echo "$ONE_FILE" | xargs)  # trim whitespace
              if [ -z "$ONE_FILE" ]; then continue; fi
              FILE_IDX=$((FILE_IDX + 1))
              echo ""
              echo "============================================"
              echo "▶ FILE $FILE_IDX/$TOTAL: $ONE_FILE"
              echo "============================================"
              if [ ! -f "$ONE_FILE" ]; then
                echo "❌ File '$ONE_FILE' không tồn tại, BỎ QUA"
                continue
              fi
              ACC_COUNT=$(grep -c '.' "$ONE_FILE" 2>/dev/null || echo 0)
              echo "📄 $ONE_FILE: $ACC_COUNT dòng"
              python spin_and_transfer.py --list "$ONE_FILE" \
                --password "$PW" --dest "$DEST_ID" $DEST_FLAGS $FORWARD_FLAGS \
                --execute --phase all --prune \
                --batch-size "$BATCH" --workers "$WORKERS" $PIPELINE_FLAG \
                --append --skip-done
              echo "✅ Xong file $ONE_FILE"
            done
            echo ""
            echo "🎉 Đã xử lý xong tất cả file"
          else
            echo "▶ Tự tìm acc*.txt trong repo (pipeline: $PIPELINE)"
            python spin_and_transfer.py \
              --password "$PW" --dest "$DEST_ID" $DEST_FLAGS $FORWARD_FLAGS \
              --execute --phase all --prune \
              --batch-size "$BATCH" --workers "$WORKERS" $PIPELINE_FLAG \
              --append --skip-done
          fi

      - name: Xóa tin nhắn nhận x (wipe PM inbox)
        if: env.PM_USER != '' && env.PM_USER != 'n/a'
        run: |
          PM_USER_ACTUAL="$PM_USER"
          PM_PASS_ACTUAL="$PM_PW"
          # Default: dùng DEST_USER / DEST_PASS (đồng bộ với tk nhận xu cấp 1)
          if [ "$PM_USER_ACTUAL" = "nguyenpy1" ] || [ -z "$PM_USER_ACTUAL" ]; then
            if [ -n "$DEST_USER" ]; then
              PM_USER_ACTUAL="$DEST_USER"
            else
              PM_USER_ACTUAL="nguyenpy1"
            fi
            # Nếu pm_pass rỗng, dùng dest_pass (script sẽ fallback tiếp DEST_PASS)
            if [ -z "$PM_PASS_ACTUAL" ] && [ -n "$DEST_PW" ]; then
              PM_PASS_ACTUAL="$DEST_PW"
            fi
            echo "📌 pm_user auto = $PM_USER_ACTUAL (đồng bộ với dest_user)"
          fi
          if [ -z "$PM_PASS_ACTUAL" ]; then
            # Last resort: hardcode MK của nguyenpy1 (DEST_PASS trong code)
            PM_PASS_ACTUAL="nhat434241"
            echo "📌 pm_pass auto = DEST_PASS constant trong spin_and_transfer.py"
          fi
          echo "🗑️  Wipe PM inbox: $PM_USER_ACTUAL"
          # Wipe 3 lần (mỗi lần cách 5s) để đảm bảo sạch + bắt tin mới dồn về
          python pm_clean_all.py --user "$PM_USER_ACTUAL" --password "$PM_PASS_ACTUAL" || echo "⚠️ Lần 1 thất bại"
          sleep 5
          python pm_clean_all.py --user "$PM_USER_ACTUAL" --password "$PM_PASS_ACTUAL" || echo "⚠️ Lần 2 thất bại"
          sleep 5
          python pm_clean_all.py --user "$PM_USER_ACTUAL" --password "$PM_PASS_ACTUAL" || echo "⚠️ Lần 3 thất bại"
          echo "✅ Wipe xong (3 lần)"

      - name: Commit kết quả
        if: always()
        run: |
          git config user.email "bot@users.noreply.github.com"
          git config user.name "bot"
          git add phase1_spin.csv phase2_transfer.csv acc_invalid.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "update spin/transfer results" && git push

      - name: Upload kết quả
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ket-qua-${{ github.run_id }}
          path: |
            phase1_spin.csv
            phase2_transfer.csv
            acc_invalid.txt
          if-no-files-found: ignore
