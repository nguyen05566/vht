name: Quay & Chuyển x & Xóa tin nhắn

on:
  workflow_dispatch:
    inputs:
      list_file:
        description: 'File danh sách, nhiều file cách nhau dấu phẩy (vd accfast1.txt,accfast2.txt). Để trống = tự tìm acc*.txt'
        required: false
        default: ''
      prefix:
        description: 'Tên đầu nếu KHÔNG dùng file (vd test). Kết hợp với start/end'
        required: false
        default: ''
      start:
        description: 'Số bắt đầu (vd 1)'
        required: false
        default: '1'
      end:
        description: 'Số kết thúc'
        required: false
        default: ''
      pwd:
        description: 'Mk chung các tk'
        required: true
        default: ''
      dest_id:
        description: 'PlayerId nhận x'
        required: true
        default: '65692738'
      pm_user:
        description: 'Tk cần xóa tin nhắn. Gõ n/a để BỎ QUA bước xóa tin'
        required: false
        default: ''
      pm_pass:
        description: 'Mk tk xóa tin'
        required: false
        default: ''
      workers:
        description: 'Số luồng (5-50, default 30)'
        required: false
        default: '30'
      batch_size:
        description: 'Account mỗi lô (default 500)'
        required: false
        default: '500'
      pipeline:
        description: 'Pipeline: quay lô sau song song chuyển lô trước (gấp 2x)'
        required: false
        type: boolean
        default: true

env:
  LIST_FILE: ${{ github.event.inputs.list_file || '' }}
  PREFIX: ${{ github.event.inputs.prefix || '' }}
  START: ${{ github.event.inputs.start || '1' }}
  END: ${{ github.event.inputs.end || '5138' }}
  PW: ${{ github.event.inputs.pwd }}
  DEST_ID: ${{ github.event.inputs.dest_id || '65692738' }}
  PM_USER: ${{ github.event.inputs.pm_user || '' }}
  PM_PW: ${{ github.event.inputs.pm_pass || '' }}
  WORKERS: ${{ github.event.inputs.workers || '30' }}
  BATCH: ${{ github.event.inputs.batch_size || '500' }}
  PIPELINE: ${{ github.event.inputs.pipeline || 'true' }}

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Quay vòng quay + Chuyển toàn bộ x
        run: |
          PIPELINE_FLAG=""
          if [ "$PIPELINE" = "true" ]; then
            PIPELINE_FLAG="--pipeline"
          fi

          if [ -n "$PREFIX" ]; then
            echo "▶ Dải tên: $PREFIX $START..$END (pipeline: $PIPELINE)"
            if [ -z "$END" ]; then
              echo "❌ Thiếu số kết thúc (end). Gõ prefix + start + end."
              exit 1
            fi
            python spin_and_transfer.py --range "$PREFIX $START $END" \
              --password "$PW" --dest "$DEST_ID" --execute --phase all --prune \
              --batch-size "$BATCH" --workers "$WORKERS" $PIPELINE_FLAG \
              --append --skip-done
          elif [ -n "$LIST_FILE" ]; then
            # Chạy TỪNG FILE lần lượt, không gộp
            FILE_IDX=0
            TOTAL=$(echo "$LIST_FILE" | tr ',' '\n' | wc -l)
            echo "$LIST_FILE" | tr ',' '\n' | while read -r ONE_FILE; do
              ONE_FILE=$(echo "$ONE_FILE" | xargs)  # trim whitespace
              if [ -z "$ONE_FILE" ]; then continue; fi
              FILE_IDX=$((FILE_IDX + 1))
              echo ""
              echo "============================================"
              echo "▶ FILE $FILE_IDX/$TOTAL: $ONE_FILE"
              echo "============================================"
              if [ ! -f "$ONE_FILE" ]; then
                echo "❌ File '$ONE_FILE' không tồn tại, BỎ QUA"
                continue
              fi
              ACC_COUNT=$(grep -c '.' "$ONE_FILE" 2>/dev/null || echo 0)
              echo "📄 $ONE_FILE: $ACC_COUNT dòng"
              python spin_and_transfer.py --list "$ONE_FILE" \
                --password "$PW" --dest "$DEST_ID" --execute --phase all --prune \
                --batch-size "$BATCH" --workers "$WORKERS" $PIPELINE_FLAG \
                --append --skip-done
              echo "✅ Xong file $ONE_FILE"
            done
            echo ""
            echo "🎉 Đã xử lý xong tất cả file"
          else
            echo "▶ Tự tìm acc*.txt trong repo (pipeline: $PIPELINE)"
            python spin_and_transfer.py \
              --password "$PW" --dest "$DEST_ID" --execute --phase all --prune \
              --batch-size "$BATCH" --workers "$WORKERS" $PIPELINE_FLAG \
              --append --skip-done
          fi

      - name: Xóa tin nhắn nhận x
        if: env.PM_USER != '' && env.PM_USER != 'n/a'
        run: |
          python pm_clean_all.py --user "$PM_USER" --password "$PM_PW" || echo "⚠️ Xóa tin thất bại (chạy lại sau)"

      - name: Commit kết quả
        if: always()
        run: |
          git config user.email "bot@users.noreply.github.com"
          git config user.name "bot"
          git add phase1_spin.csv phase2_transfer.csv acc_invalid.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "update spin/transfer results" && git push

      - name: Upload kết quả
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ket-qua-${{ github.run_id }}
          path: |
            phase1_spin.csv
            phase2_transfer.csv
            acc_invalid.txt
          if-no-files-found: ignore
