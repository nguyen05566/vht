name: nguyen4

on:
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: 'Runtime (hours)'
        required: false
        default: '5.99722'
        type: string
  schedule:  # BẬT - tự động mở phiên nối tiếp mỗi 6h, gần như không nghỉ
    - cron: '15 */6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-gamevh-account
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 359.8333
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install websockets requests --break-system-packages

      - name: Cache Embryo engine
        id: cache-embryo
        uses: actions/cache@v4
        with:
          path: embryo-engine
          key: embryo-caro6-linux-1.2.0-c6

      - name: Run Caro Bot nguyen4 (Linux native engine, no wine)
        env:
          CARO_RUNTIME_HOURS: ${{ inputs.runtime_hours || '5.7' }}
          # Ưu tiên Secrets nếu có, không có thì nguyen4.py fallback về hardcode nguyen4
          CARO_USER: ${{ secrets.CARO_USER }}
          CARO_PWWD: ${{ secrets.CARO_PWWD }}
        run: |
          echo "Starting nguyen4.py; it will auto-restart until job timeout (6h)"
          while true; do
            echo "=== $(date -u +'%Y-%m-%dT%H:%M:%SZ') Starting nguyen4.py ==="
            python3 -u nguyen4.py || echo "nguyen4.py exited with code $?"
            echo "Restarting nguyen4.py in 10 seconds"
            sleep 10
          done
