name: nguyen-multi

on:
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: 'Runtime (hours)'
        required: false
        default: '5.7'
        type: string
  schedule:  # Watchdog: tu phuc hoi neu chuoi ban giao bi dut
    - cron: '35 */6 * * *'

permissions:
  contents: read
  actions: write  # can de tu kich phien ke tiep qua API

concurrency:
  group: ${{ github.workflow }}-gamevh-multi
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install websockets requests websocket-client --break-system-packages

      - name: Run Caro Bots nguyen* trong 1 job (tu ban giao tru khi het gio)
        env:
          CARO_RUNTIME_HOURS: ${{ inputs.runtime_hours || '5.7' }}
          # Khong truyen mat khau qua env — moi bot nguyenN dung pw hardcode rieng
          MULTI_STAGGER: '20'
          HANDOFF_MINUTES: '348'
          # Chuyen xu dinh ky ve 10055407 (lan dau ngay sau login, sau do lap lai)
          CARO_TRANSFER_INTERVAL: '9000'
          CARO_TRANSFER_PERCENT: '20'
        run: |
          START=$(date +%s)
          LIMIT=$((HANDOFF_MINUTES * 60))
          echo "7 bot nguyen (pw hardcode rieng tung bot) chay toi da ${HANDOFF_MINUTES} phut roi tu ban giao sang phien moi (job timeout 355p)"
          while true; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - START))
            REMAINING=$((LIMIT - ELAPSED))
            if [ "$REMAINING" -le 60 ]; then
              echo "Con ${REMAINING}s < 60s: den gio ban giao, dung bot de kich phien moi"
              break
            fi
            echo "=== $(date -u +'%Y-%m-%dT%H:%M:%SZ') Starting nguyen_multi.py (phut $((ELAPSED / 60))/${HANDOFF_MINUTES}) ==="
            # Gioi han moi luot khong vuot qua gio ban giao (launcher tu thoat neu het CARO_RUNTIME_HOURS)
            timeout "${REMAINING}s" python3 -u nguyen_multi.py || echo "nguyen_multi.py exited with code $?"
            echo "Restarting nguyen_multi.py in 10 seconds"
            sleep 10
          done

      - name: Kich phien ke tiep (ban giao lien tuc)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/nguyen-multi.yml/dispatches \
              -d '{"ref":"main"}')
            echo "Lan $i: dispatch HTTP $CODE"
            if [ "$CODE" = "204" ]; then
              echo "Da kich phien moi thanh cong"
              exit 0
            fi
            sleep 15
          done
          echo "Khong kich duoc phien moi sau 3 lan thu (cron 6h se tu phuc hoi)"
          exit 1
