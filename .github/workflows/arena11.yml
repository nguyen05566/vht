name: arena11

on:
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: 'Runtime (hours)'
        required: false
        default: '5.7'
        type: string
      dest_id:
        description: 'PlayerId nhận xu (mặc định 10055407)'
        required: false
        default: '10055407'
        type: string
      transfer_percent:
        description: 'Phần trăm xu chuyển sau login (0=tắt, mặc định 20)'
        required: false
        default: '20'
        type: string
  schedule:  # Luoi an toan / watchdog: tu phuc hoi neu chuoi ban giao bi dut
    - cron: '15 */6 * * *'

permissions:
  contents: read
  actions: write  # can de tu kich phien ke tiep qua API

concurrency:
  group: ${{ github.workflow }}-gamevh-account
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install websockets requests --break-system-packages

      - name: Cache Embryo engine
        id: cache-embryo
        uses: actions/cache@v4
        with:
          path: embryo-engine
          key: embryo-caro6-linux-1.2.0-c6

      - name: Run Caro Bot arena11 (tu ban giao truoc khi het gio)
        env:
          CARO_RUNTIME_HOURS: ${{ inputs.runtime_hours || '5.7' }}
          # Uu tien Secrets neu co, khong co thi arena11.py fallback ve hardcode vu829 (username hien tai)
          CARO_USER: ${{ secrets.CARO_USER }}
          CARO_PWWD: ${{ secrets.CARO_PWWD }}
          CARO_DEST_ID: ${{ github.event.inputs.dest_id || '10055407' }}
          CARO_TRANSFER_PERCENT: ${{ github.event.inputs.transfer_percent || '20' }}
          HANDOFF_MINUTES: '348'
          # THÍ NGHIỆM: ngồi sảnh dò bàn đối phương 10k→100k (không tự tạo bàn)
          CARO_MODE: hunt
          CARO_HUNT_BETS: '10000,20000,40000,50000,100000'
          CARO_HUNT_INTERVAL: '12'
          CARO_HUNT_PAUSE: '25'
          CARO_HUNT_LEAVE_AFTER: '1'
          CARO_HUNT_RENAME_AFTER: '1'
          CARO_HUNT_AVATAR_AFTER: '1'
          CARO_HUNT_WS_RESTART: '1'
          CARO_HUNT_AVOID_FAMILY: '0'
          CARO_HUNT_COOLDOWN: '180'
        run: |
          START=$(date +%s)
          LIMIT=$((HANDOFF_MINUTES * 60))
          echo "Bot chay toi da ${HANDOFF_MINUTES} phut roi tu ban giao sang phien moi (job timeout 355p)"
          while true; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - START))
            REMAINING=$((LIMIT - ELAPSED))
            if [ "$REMAINING" -le 60 ]; then
              echo "Con ${REMAINING}s < 60s: den gio ban giao, dung bot de kich phien moi"
              break
            fi
            echo "=== $(date -u +'%Y-%m-%dT%H:%M:%SZ') Starting arena11.py (phut $((ELAPSED / 60))/${HANDOFF_MINUTES}) ==="
            # Gioi han moi luot bot khong vuot qua gio ban giao (bot tu thoat som hon neu crash/het RUNTIME)
            timeout "${REMAINING}s" python3 -u arena11.py || echo "arena11.py exited with code $?"
            echo "Restarting arena11.py in 10 seconds"
            sleep 10
          done

      - name: Kich phien ke tiep (ban giao lien tuc)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/arena11.yml/dispatches \
              -d '{"ref":"main"}')
            echo "Lan $i: dispatch HTTP $CODE"
            if [ "$CODE" = "204" ]; then
              echo "Da kich phien moi thanh cong"
              exit 0
            fi
            sleep 15
          done
          echo "Khong kich duoc phien moi sau 3 lan thu (cron 6h se tu phuc hoi)"
          exit 1
