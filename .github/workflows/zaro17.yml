name: zaro17

on:
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: 'Runtime (hours)'
        required: false
        default: '5.9'
        type: string
  schedule:
    - cron: '81 */6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-gamevh-account
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install websockets websocket-client requests --break-system-packages

      - name: Run Caro Bot zaro17 (400 xu, no avatar, acc from acc_valid_3.txt[0])
        env:
          CARO_RUNTIME_HOURS: ${{ inputs.runtime_hours || '5.9' }}
          CARO_ACC_FILE: "acc_valid_3.txt"
          CARO_ACC_INDEX: "0"
        run: |
          echo "Starting zaro17.py (Caro, 400 xu, acc=acc_valid_3.txt[0])"
          while true; do
            echo "=== $(date -u +'%Y-%m-%dT%H:%M:%SZ') Starting zaro17.py ==="
            python3 -u zaro17.py || echo "zaro17.py exited with code $?"
            echo "Restarting zaro17.py in 10 seconds"
            sleep 10
          done
