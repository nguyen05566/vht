name: Do + Quay + Chuyen X

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'MK chung cac tk'
        required: true
      dest_id:
        description: 'PlayerId nhan x'
        required: false
        default: '65692738'
      pattern:
        description: 'Pattern file tk (default: acc*.txt)'
        required: false
        default: 'acc*.txt'
      batch_size:
        description: 'Tk moi lo (default: 750)'
        required: false
        default: '750'
      workers:
        description: 'So luong quay/chuyen (default: 30)'
        required: false
        default: '30'
      batch_pause:
        description: 'Nghi giua cac lo (giay, default: 10)'
        required: false
        default: '10'

env:
  PW: ${{ github.event.inputs.password }}
  DEST_ID: ${{ github.event.inputs.dest_id || '65692738' }}
  PATTERN: ${{ github.event.inputs.pattern || 'acc*.txt' }}
  BATCH_SIZE: ${{ github.event.inputs.batch_size || '750' }}
  WORKERS: ${{ github.event.inputs.workers || '30' }}
  BATCH_PAUSE: ${{ github.event.inputs.batch_pause || '10' }}

permissions:
  contents: write

jobs:
 scan_and_transfer:
   runs-on: ubuntu-latest
   timeout-minutes: 360

   steps:
     - name: Checkout
       uses: actions/checkout@v4
       with:
         token: ${{ secrets.GH_PAT }}

     - name: Setup Python
       uses: actions/setup-python@v5
       with:
         python-version: '3.12'

     - name: Install dependencies
       run: |
         pip install -r requirements.txt

     - name: Chia lo + Quay + Chuyen xu
       run: |
         python scan_and_transfer.py \
           --password "$PW" \
           --dest "$DEST_ID" \
           --pattern "$PATTERN" \
           --batch-size "$BATCH_SIZE" \
           --workers "$WORKERS" \
           --batch-pause "$BATCH_PAUSE"
